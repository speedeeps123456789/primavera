name: Build and Test Fonts

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.in

      - name: Run Fontbakery QA
        run: |
          fontbakery check-googlefonts fonts/variable/*.ttf --html report.html --json report.json || true

      - name: Archive QA report
        uses: actions/upload-artifact@v4
        with:
          name: fontbakery-report
          path: |
            report.html
            report.json
